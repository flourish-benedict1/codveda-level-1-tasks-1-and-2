<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Form | Flourish Benedict</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
  .card{background:#fff;width:100%;max-width:420px;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  h2{text-align:center;color:#0f172a;margin:0 0 5px}
  p.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:20px}
  label{font-weight:bold;font-size:14px;display:block;margin-top:15px}
  input{width:100%;padding:12px;margin-top:5px;border:2px solid #cbd5e1;border-radius:8px;outline:none;font-size:15px}
  input:focus{border-color:#2563eb;background:#eff6ff}
  input.valid{border-color:#16a34a}
  input.invalid{border-color:#dc2626}
  small{color:#dc2626;font-size:12px;display:block;margin-top:3px;min-height:15px}
  .strength{font-size:12px;margin-top:3px}
  button{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
  button:hover{background:#1d4ed8}
  #success{display:none;background:#dcfce7;color:#166534;padding:12px;border-radius:8px;text-align:center;margin-top:20px;font-weight:bold}
  .footer{text-align:center;font-size:12px;color:#94a3b8;margin-top:15px}
</style>
</head>
<body>
<div class="card">
  <h2>Create Account</h2>
  <p class="sub">Intern @ Codveda Technologies | Task 2</p>

  <form id="myForm" novalidate>
    <label>Full Name</label>
    <input type="text" id="name" placeholder="e.g. Flourish Benedict">
    <small id="nameError"></small>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="e.g. you@gmail.com">
    <small id="emailError"></small>

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="e.g. 08012345678">
    <small id="phoneError"></small>

    <label>Password</label>
    <input type="password" id="password" placeholder="Min 8 characters">
    <div class="strength" id="strength"></div>
    <small id="passwordError"></small>

    <button type="submit">Submit Form</button>
  </form>

  <div id="success">✅ Form Submitted Successfully! Welcome, <span id="successName"></span>!</div>
  <div class="footer">Built with HTML, CSS & JavaScript by Flourish Benedict</div>
</div>

<script>
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const phoneInput = document.getElementById('phone');
const passInput = document.getElementById('password');

function setError(input, errorId, msg){
  document.getElementById(errorId).textContent = msg;
  input.classList.remove('valid'); input.classList.add('invalid');
  return false;
}
function setValid(input, errorId){
  document.getElementById(errorId).textContent = '';
  input.classList.remove('invalid'); input.classList.add('valid');
  return true;
}

function validateName(){
  if(nameInput.value.trim().length < 3) return setError(nameInput,'nameError','Name must be at least 3 characters');
  return setValid(nameInput,'nameError');
}
function validateEmail(){
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!re.test(emailInput.value.trim())) return setError(emailInput,'emailError','Please enter a valid email');
  return setValid(emailInput,'emailError');
}
function validatePhone(){
  const cleaned = phoneInput.value.replace(/\s/g,'');
  if(!/^[0-9]{10,11}$/.test(cleaned)) return setError(phoneInput,'phoneError','Enter 10 or 11 digit phone number');
  return setValid(phoneInput,'phoneError');
}
function validatePassword(){
  const v = passInput.value;
  const strengthEl = document.getElementById('strength');
  if(v.length < 8) { strengthEl.textContent=''; return setError(passInput,'passwordError','Password must be at least 8 characters'); }
  if(v.length < 12){ strengthEl.textContent='Strength: Medium 🟡'; strengthEl.style.color='#ca8a04'; }
  else { strengthEl.textContent='Strength: Strong 🟢'; strengthEl.style.color='#16a34a'; }
  return setValid(passInput,'passwordError');
}

// Real-time + Focus / Blur
[nameInput,emailInput,phoneInput,passInput].forEach(inp=>{
  inp.addEventListener('input', ()=>{
    if(inp===nameInput) validateName();
    if(inp===emailInput) validateEmail();
    if(inp===phoneInput) validatePhone();
    if(inp===passInput) validatePassword();
  });
  inp.addEventListener('blur', ()=>{
    if(inp===nameInput) validateName();
    if(inp===emailInput) validateEmail();
    if(inp===phoneInput) validatePhone();
    if(inp===passInput) validatePassword();
  });
  inp.addEventListener('focus', ()=>{ inp.style.borderColor='#2563eb'; });
});

document.getElementById('myForm').addEventListener('submit', function(e){
  e.preventDefault();
  const a=validateName(), b=validateEmail(), c=validatePhone(), d=validatePassword();
  if(a && b && c && d){
    document.getElementById('successName').textContent = nameInput.value.trim();
    document.getElementById('success').style.display='block';
    this.reset();
    [nameInput,emailInput,phoneInput,passInput].forEach(i=>i.classList.remove('valid'));
  } else {
    document.getElementById('success').style.display='none';
  }
});
</script>
</body>
</html>
